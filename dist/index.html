    <div id="root"></div>

    <!-- Legacy Mode Fallback -->
    <div id="legacy-root">
        <h1>Rakko System Lite</h1>
        <div id="legacy-status">Checking environment...</div>

        <div class="legacy-list">
            <div class="legacy-item" id="check-google">Google: <span class="status-pending">Pending</span></div>
            <div class="legacy-item" id="check-rakko">Rakko: <span class="status-pending">Pending</span></div>
            <div class="legacy-item" id="check-cf">Cloudflare: <span class="status-pending">Pending</span></div>
        </div>

        <div class="legacy-info" id="legacy-info">Loading info...</div>

        <a href="javascript:location.reload()" class="legacy-btn">Refresh / Reload</a>
    </div>

    <script>
        (function () {
            var ua = navigator.userAgent;
            var isIE = ua.indexOf('MSIE ') > -1;
            var isOldChrome = /Chrome\/(\d+)/.exec(ua);
            var shouldRunLegacy = false;

            if (isIE) {
                var ieVersion = parseInt(ua.split('MSIE ')[1]);
                if (ieVersion <= 10) shouldRunLegacy = true;
            } else if (isOldChrome && parseInt(isOldChrome[1]) <= 45) {
                shouldRunLegacy = true;
            }

            // Force legacy mode for debugging if ?legacy=true
            if (window.location.search.indexOf('legacy=true') > -1) shouldRunLegacy = true;

            if (shouldRunLegacy) {
                document.getElementById('root').style.display = 'none';
                document.getElementById('legacy-root').style.display = 'block';

                // Basic Checks
                function setStatus(id, text, className) {
                    var el = document.getElementById(id);
                    if (el) el.innerHTML = id.replace('check-', '') + ': <span class="' + className + '">' + text + '</span>';
                }

                function checkImage(id, url) {
                    setStatus(id, 'Checking...', 'status-running');
                    var img = new Image();
                    img.onload = function () { setStatus(id, 'OK', 'status-success'); };
                    img.onerror = function () { setStatus(id, 'Fail', 'status-error'); };
                    img.src = url + (url.indexOf('?') > -1 ? '&' : '?') + 't=' + new Date().getTime();
                }

                // Run Checks
                setTimeout(function () { checkImage('check-google', 'https://www.google.com/favicon.ico'); }, 500);
                setTimeout(function () { checkImage('check-rakko', 'https://rakko.cn/favicon.ico'); }, 1500);
                setTimeout(function () { checkImage('check-cf', 'https://www.cloudflare.com/favicon.ico'); }, 2500);

                // Info
                var info = "UA: " + ua + "<br>";
                info += "Screen: " + screen.width + "x" + screen.height + "<br>";
                info += "Cookie: " + (navigator.cookieEnabled ? "Yes" : "No");
                document.getElementById('legacy-info').innerHTML = info;
            }
        })();
    </script>
